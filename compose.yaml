services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faultdeck
      POSTGRES_PASSWORD: faultdeck_dev
      POSTGRES_DB: faultdeck
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultdeck -d faultdeck"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: faultdeck
      RABBITMQ_DEFAULT_PASS: faultdeck_dev
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: faultdeck_dev
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "faultdeck", "-d", "faultdeck", "-f", "/migrations/001_failure_events.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    environment:
      DATABASE_URL: postgres://faultdeck:faultdeck_dev@postgres:5432/faultdeck
      RABBITMQ_URL: amqp://faultdeck:faultdeck_dev@rabbitmq:5672
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    profiles: [demo]
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    command: ["worker"]
    environment:
      RABBITMQ_URL: amqp://faultdeck:faultdeck_dev@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://faultdeck:faultdeck_dev@postgres:5432/faultdeck
      RABBITMQ_URL: amqp://faultdeck:faultdeck_dev@rabbitmq:5672
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
